<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Deepavali</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd36a;--amber:#ff9a1f;--bg1:#05030f;--bg2:#2b0b3d;--bg3:#4a0f2a;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg1);color:#fff;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 90% at 50% 105%,var(--bg3) 0,var(--bg2) 38%,var(--bg1) 78%);font-family:"Cormorant Garamond",Georgia,serif}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#aura{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transform:scale(.2);transform-origin:50% 62%;transition:opacity 2.6s ease,transform 3s ease;background:radial-gradient(circle at 50% 62%,rgba(255,170,50,.55) 0,rgba(255,110,20,.22) 28%,rgba(120,30,90,.12) 52%,transparent 72%)}
.glow #aura{opacity:1;transform:scale(1.4)}
#app{position:relative;z-index:2;height:100%;width:100%;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.garland{width:100%;height:clamp(18px,4.2vh,30px);flex:none;position:relative;opacity:0;transition:opacity 2s}
.glow .garland{opacity:1}
.garland i{position:absolute;left:0;right:0;height:100%;background:radial-gradient(circle at 50% 50%,#fff2a8 0 12%,#ffc21a 13% 38%,#ff8a00 39% 66%,#c44d00 67% 100%);background-size:clamp(18px,4.2vh,30px) 100%;filter:drop-shadow(0 0 6px rgba(255,150,0,.7))}
.garland i:nth-child(2){background-position:50% 0;opacity:.75;transform:translateY(55%) scale(.7)}
.head{flex:none;text-align:center;padding:clamp(6px,2vh,18px) 16px 0;max-width:900px}
h1{font-family:Cinzel,Georgia,serif;font-weight:800;letter-spacing:.08em;font-size:clamp(1.7rem,min(8.5vw,9vh),4.4rem);line-height:1.05;background:linear-gradient(180deg,#fff7cf,#ffd36a 45%,#d98a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,170,40,.65));opacity:0;transform:translateY(14px) scale(.94);letter-spacing:.3em;transition:opacity 1.6s,transform 1.6s,letter-spacing 2.2s}
.t1 h1{opacity:1;transform:none;letter-spacing:.08em}
.sub{font-family:Cinzel,Georgia,serif;font-size:clamp(.65rem,min(2.6vw,2.4vh),1.05rem);letter-spacing:.42em;color:#ffb347;margin-top:clamp(4px,1.2vh,12px);opacity:0;transition:opacity 1.6s;text-shadow:0 0 10px rgba(255,140,0,.6)}
.t2 .sub{opacity:1}
.msg{font-style:italic;font-size:clamp(.85rem,min(3.6vw,2.7vh),1.35rem);line-height:1.35;color:#ffe9c4;margin:clamp(4px,1.4vh,14px) auto 0;max-width:36em;opacity:0;transform:translateY(8px);transition:opacity 1.8s,transform 1.8s;text-shadow:0 0 12px rgba(0,0,0,.8)}
.t3 .msg{opacity:1;transform:none}
.stage{flex:1;min-height:0;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2.5vw,26px);padding:0 8px clamp(2px,1vh,10px)}
.rangoli{position:absolute;left:50%;bottom:-4%;width:min(88vw,64vh,560px);aspect-ratio:1;transform:translateX(-50%);opacity:0;transition:opacity 2.5s;z-index:0;pointer-events:none}
.rangoli svg{width:100%;height:100%;animation:spin 90s linear infinite}
.glow .rangoli{opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
.diya{position:relative;z-index:1;flex:none;display:block;background:none;border:0;padding:0;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s}
.diya.show{opacity:1;transform:none}
.diya svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
.s1{width:min(17vw,12vh,110px)}.s2{width:min(21vw,15vh,140px)}
.diya.main{width:min(40vw,27vh,260px);cursor:pointer;margin:0 clamp(0px,1vw,10px)}
.diya.main:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}
.halo{position:absolute;left:50%;top:6%;width:190%;aspect-ratio:1;transform:translate(-50%,-30%) scale(.3);border-radius:50%;background:radial-gradient(circle,rgba(255,190,70,.75) 0,rgba(255,120,20,.28) 35%,transparent 68%);opacity:0;transition:opacity 1.6s,transform 1.6s;pointer-events:none;z-index:-1}
.lit .halo{opacity:.75;transform:translate(-50%,-30%) scale(1)}
.boost .halo{opacity:1;transform:translate(-50%,-30%) scale(1.35)}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0;transition:transform 1.6s cubic-bezier(.2,.9,.3,1),opacity 1s}
.lit .flame{transform:scale(1);opacity:1}
.boost .flame{transform:scale(1.4)}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.s1 .fl{animation-duration:.9s}.s2 .fl{animation-duration:1.3s}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.06) skewX(3deg)}60%{transform:scale(1.04,.96) skewX(-3deg)}100%{transform:scale(.97,1.05) skewX(2deg)}}
.hint{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 .6rem Cinzel,Georgia,serif;letter-spacing:.3em;color:#ffd9a0;opacity:0;white-space:nowrap;transition:opacity 1s}
.t4 .hint{opacity:.8}
.done .hint{opacity:0}
.blessing{flex:none;height:clamp(22px,4.6vh,36px);display:flex;align-items:center;justify-content:center;font-family:Cinzel,Georgia,serif;font-size:clamp(.65rem,min(2.9vw,2.4vh),1.1rem);letter-spacing:.14em;text-align:center;color:#fff1c8;padding:0 12px;opacity:0;transform:scale(.95);transition:opacity 1s,transform 1s;text-shadow:0 0 14px rgba(255,170,40,.9)}
.blessing.on{opacity:1;transform:none}
.bottom{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;padding:0 16px clamp(8px,2vh,20px);opacity:0;transition:opacity 1.5s;position:relative}
.t4 .bottom{opacity:1}
.ad{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 clamp(26px,7vw,44px);border-radius:999px;font:800 clamp(.8rem,3.4vw,1rem) Cinzel,Georgia,serif;letter-spacing:.14em;color:#3a1500;text-decoration:none;background:linear-gradient(135deg,#fff1a8 0,#ffc93a 35%,#f08a10 70%,#ffd36a 100%);border:1.5px solid rgba(255,240,180,.9);box-shadow:0 0 0 3px rgba(255,200,80,.25),0 0 22px rgba(255,170,40,.65);animation:pulse 2.4s ease-in-out infinite}
.ad:hover,.ad:focus-visible{filter:brightness(1.1)}
.ad:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(255,200,80,.25),0 0 18px rgba(255,170,40,.5)}50%{transform:scale(1.045);box-shadow:0 0 0 6px rgba(255,200,80,.15),0 0 32px rgba(255,170,40,.85)}}
.replay{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 4px);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,211,106,.6);background:rgba(30,10,45,.7);color:var(--gold);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s;backdrop-filter:blur(4px)}
.t4 .replay{opacity:1;pointer-events:auto}
.replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
.replay:hover{background:rgba(70,25,80,.85)}
.replay span{position:absolute;bottom:-14px;font:600 .5rem Cinzel,serif;letter-spacing:.12em;color:#ffd9a0}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 #aura,.garland,h1,.sub,.msg,.diya,.halo,.flame,.rangoli,.bottom,.blessing{transition-duration:.01s!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gBowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36a"/><stop offset=".45" stop-color="#c8791a"/><stop offset="1" stop-color="#5e2a05"/></linearGradient>
<linearGradient id="gRim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a4a0c"/><stop offset=".35" stop-color="#ffe08a"/><stop offset=".7" stop-color="#d9962a"/><stop offset="1" stop-color="#7a3d08"/></linearGradient>
<radialGradient id="gOil" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffb347"/><stop offset=".6" stop-color="#7a2f00"/><stop offset="1" stop-color="#2a0e00"/></radialGradient>
<linearGradient id="gFl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset=".5" stop-color="#ffa21a"/><stop offset="1" stop-color="#ffe27a"/></linearGradient>
<radialGradient id="gCore" cx=".5" cy=".75" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff2a8"/><stop offset="1" stop-color="#ffd36a" stop-opacity="0"/></radialGradient>
<filter id="fb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs></svg>

<canvas id="fx"></canvas>
<div id="aura"></div>

<main id="app">
 <div class="garland" aria-hidden="true"><i></i><i></i></div>
 <header class="head">
  <h1>HAPPY DEEPAVALI</h1>
  <div class="sub">THE FESTIVAL OF LIGHTS</div>
  <p class="msg">May the divine light of Deepavali bring happiness, prosperity, peace, and endless blessings into your life.</p>
 </header>
 <section class="stage" id="stage">
  <div class="rangoli" aria-hidden="true"><svg viewBox="-100 -100 200 200" fill="none" stroke="#ffcf6a" stroke-width=".9">
   <defs><path id="pt" d="M0 -30 C9 -42 9 -62 0 -78 C-9 -62 -9 -42 0 -30Z"/><path id="pt2" d="M0 -80 C5 -86 5 -92 0 -97 C-5 -92 -5 -86 0 -80Z"/></defs>
   <circle r="97" opacity=".5"/><circle r="28" opacity=".7" stroke="#ff8a2a"/><circle r="22" opacity=".5"/>
   <g id="rg"></g>
  </svg></div>
  <button class="diya s1" aria-hidden="true" tabindex="-1" data-d></button>
  <button class="diya s2" aria-hidden="true" tabindex="-1" data-d></button>
  <button class="diya main" id="main" aria-label="Light the diya: celebrate with fireworks" data-d><span class="hint">TAP THE DIYA</span></button>
  <button class="diya s2" aria-hidden="true" tabindex="-1" data-d></button>
  <button class="diya s1" aria-hidden="true" tabindex="-1" data-d></button>
 </section>
 <div class="blessing" id="bless" role="status" aria-live="polite">Spread Light. Share Happiness. Celebrate Life.</div>
 <div class="bottom">
  <a class="ad" href="https://uplcm.com/4/10448607" target="_blank" rel="noopener noreferrer sponsored">EXPLORE MORE ✨</a>
 </div>
</main>
<button class="replay" id="replay" aria-label="Replay animation" title="Replay animation">↻<span>REPLAY</span></button>

<script>
(function(){
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var body=document.body,cv=document.getElementById('fx'),cx=cv.getContext('2d');
var W=0,H=0,dpr=1;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);

/* rangoli petals */
var rg=document.getElementById('rg'),h='';
for(var i=0;i<12;i++){h+='<use href="#pt" transform="rotate('+(i*30)+')" fill="rgba(255,150,40,.12)"/><use href="#pt2" transform="rotate('+(i*30+15)+')" stroke="#ff7a3a"/><circle cx="0" cy="-88" r="1.8" fill="#ffd36a" transform="rotate('+(i*30)+')"/>'}
rg.innerHTML=h;

/* diya svgs */
var DIYA='<div class="halo"></div><svg viewBox="0 -45 200 195" aria-hidden="true">'+
'<ellipse cx="100" cy="142" rx="52" ry="7" fill="#000" opacity=".5"/>'+
'<path d="M8 66C8 118 58 142 100 142S192 118 192 66Q100 90 8 66Z" fill="url(#gBowl)"/>'+
'<path d="M30 100Q60 128 100 130" stroke="#fff3b0" stroke-width="2" opacity=".35" fill="none"/>'+
'<ellipse cx="100" cy="66" rx="92" ry="17" fill="url(#gRim)"/>'+
'<ellipse cx="100" cy="67" rx="78" ry="11" fill="url(#gOil)"/>'+
'<path d="M92 68Q100 56 108 68Z" fill="#2a1200"/>'+
'<g class="flame"><g class="fl">'+
'<path d="M100 -38C118 -8 126 24 100 62C74 24 82 -8 100 -38Z" fill="url(#gFl)" filter="url(#fb)" opacity=".95"/>'+
'<path d="M100 -6C110 14 112 34 100 60C88 34 90 14 100 -6Z" fill="url(#gCore)"/></g></g></svg>';
var diyas=[].slice.call(document.querySelectorAll('[data-d]'));
diyas.forEach(function(d){d.insertAdjacentHTML('beforeend',DIYA)});
var main=document.getElementById('main'),bless=document.getElementById('bless');

/* effects */
var parts=[],bursts=[],amb=[],running=false,autoT=0;
var COLORS=[[42,100,62],[28,100,58],[350,90,62],[285,80,70],[50,100,75],[18,100,60]];
function burst(x,y,n){
 var c=COLORS[(Math.random()*COLORS.length)|0],big=Math.random()<.4;n=n||(W<600?46:70);
 for(var i=0;i<n;i++){var a=Math.PI*2*i/n+Math.random()*.2,s=(big?3.4:2.4)*(.45+Math.random()*.75);
  parts.push({x:x,y:y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.011+Math.random()*.012,h:c[0]+Math.random()*16-8,s:c[1],b:c[2]})}
 bursts.push({x:x,y:y,l:1});
 if(parts.length>700)parts.splice(0,parts.length-700);
}
function gold(x,y){for(var i=0;i<40;i++){var a=Math.random()*6.283,s=1+Math.random()*3.2;parts.push({x:x,y:y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.6,l:1,d:.014+Math.random()*.01,h:40+Math.random()*10,s:100,b:65,g:.5})}}
function auto(){if(!running||RM)return;burst(W*(.12+Math.random()*.76),H*(.12+Math.random()*.38));autoT=setTimeout(auto,650+Math.random()*900)}
for(var i=0;i<34;i++)amb.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.02+Math.random()*.06,p:Math.random()*6.28,k:0});
for(i=0;i<(W<600?14:24);i++)amb.push({x:Math.random(),y:Math.random(),r:4+Math.random()*5,v:.03+Math.random()*.05,p:Math.random()*6.28,k:1,rot:Math.random()*6.28,c:Math.random()<.6?'255,140,40':'255,90,120'});
var tm=0;
function frame(t){
 requestAnimationFrame(frame);
 cx.clearRect(0,0,W,H);
 cx.globalCompositeOperation='lighter';
 var sec=t/1000;
 for(var i=0;i<amb.length;i++){var a=amb[i];
  if(!RM){a.y+=(a.k?a.v:-a.v*.5)*.016;a.x+=Math.sin(sec*.6+a.p)*.0003;if(a.y>1.05)a.y=-.05;if(a.y<-.05)a.y=1.05}
  var X=a.x*W,Y=a.y*H;
  if(a.k){cx.save();cx.translate(X,Y);cx.rotate(a.rot+(RM?0:sec*.6+a.p));cx.scale(1,.55);cx.fillStyle='rgba('+a.c+',.55)';cx.beginPath();cx.arc(0,0,a.r,0,6.283);cx.fill();cx.restore()}
  else{var al=.35+.35*Math.sin(sec*1.5+a.p);cx.fillStyle=body.classList.contains('glow')||a.r<1.2?'rgba(255,215,120,'+al+')':'rgba(255,215,120,'+al*.4+')';cx.beginPath();cx.arc(X,Y,a.r,0,6.283);cx.fill()}
 }
 for(i=bursts.length-1;i>=0;i--){var b=bursts[i];b.l-=.07;if(b.l<=0){bursts.splice(i,1);continue}
  var g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,70*(1.2-b.l));g.addColorStop(0,'rgba(255,230,170,'+b.l*.45+')');g.addColorStop(1,'rgba(255,120,30,0)');cx.fillStyle=g;cx.fillRect(b.x-90,b.y-90,180,180)}
 cx.lineCap='round';
 for(i=parts.length-1;i>=0;i--){var p=parts[i];
  p.px=p.x;p.py=p.y;p.vx*=.975;p.vy=p.vy*.975+(p.g||.045);p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
  if(p.l<=0){parts.splice(i,1);continue}
  cx.strokeStyle='hsla('+p.h+','+p.s+'%,'+p.b+'%,'+p.l+')';cx.lineWidth=1+p.l*1.6;
  cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke()}
 cx.globalCompositeOperation='source-over';
}
requestAnimationFrame(frame);

/* timeline */
var T=[];
function at(ms,f){T.push(setTimeout(f,RM?0:ms))}
function reset(){T.forEach(clearTimeout);T=[];clearTimeout(autoT);running=false;parts.length=0;
 body.className='';diyas.forEach(function(d){d.classList.remove('show','lit','boost')});main.classList.remove('done');bless.classList.remove('on')}
function play(){
 reset();
 at(500,function(){main.classList.add('show')});
 at(1300,function(){diyas.forEach(function(d,i){if(d!==main)setTimeout(function(){d.classList.add('show')},RM?0:i*140)})});
 at(1900,function(){main.classList.add('lit')});
 at(2600,function(){body.classList.add('glow');diyas.forEach(function(d,i){if(d!==main)setTimeout(function(){d.classList.add('lit')},RM?0:i*160)})});
 at(3300,function(){running=true;burst(W*.5,H*.28);autoT=setTimeout(auto,500)});
 at(3700,function(){body.classList.add('t1')});
 at(4900,function(){body.classList.add('t2')});
 at(5900,function(){body.classList.add('t3')});
 at(7200,function(){body.classList.add('t4')});
}
var bt=0;
function celebrate(){
 var r=main.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.18;
 main.classList.add('lit','boost','done');body.classList.add('glow');
 bless.classList.add('on');
 if(!RM){gold(x,y);running=true;[0,220,440,700].forEach(function(d,i){setTimeout(function(){burst(W*(.18+Math.random()*.64),H*(.1+Math.random()*.35),W<600?50:80)},d)});
  burst(x,Math.max(40,y-H*.22),90)}
 clearTimeout(bt);bt=setTimeout(function(){main.classList.remove('boost')},2800);
}
main.addEventListener('click',celebrate);
document.getElementById('replay').addEventListener('click',play);
play();
})();
</script>
</body>
</html>
